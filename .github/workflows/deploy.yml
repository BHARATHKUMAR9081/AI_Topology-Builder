name: Build Deploy Verify AI Topology Builder

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 759204735992.dkr.ecr.ap-south-1.amazonaws.com
  ECR_REPOSITORY: ai-topology-builder
  INSTANCE_ID: i-0a00d5f35e546e425
  PUBLIC_URL: http://13.234.150.98
  CONTAINER_PORT: "80"
  BACKEND_PORT: "8000"
  SECRETS_MANAGER_ID: deptic/AI_Topology-Builder/secrets
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

jobs:
  build:
    name: Build Diagnostics and Docker Image
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      image_uri: ${{ steps.meta.outputs.image_uri }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Build diagnostics
        run: |
          set -euo pipefail
          echo "--- node/npm versions ---"
          node --version
          npm --version
          echo "--- repository layout ---"
          ls -la
          echo "--- package.json scripts ---"
          node -e "console.log(JSON.stringify(JSON.parse(require('fs').readFileSync('package.json','utf8')).scripts, null, 2))"
          test -f server/index.js && echo "server/index.js present"
          test -f index.html && echo "index.html (Vite entry) present"
          test -f vite.config.js && echo "vite.config.js present"
          test -f Dockerfile && echo "Dockerfile present"

      - name: Install dependencies and production build (Vite)
        run: |
          set -euo pipefail
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps
          npm run build
          test -f dist/index.html && echo "dist/index.html built successfully"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image tag and URI
        id: meta
        run: |
          set -euo pipefail
          IMAGE_TAG="$(git rev-parse --short HEAD)-$(date -u +%Y%m%d%H%M%S)"
          FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "image_uri=$FULL_IMAGE:$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "FULL_IMAGE=$FULL_IMAGE" >> "$GITHUB_ENV"

      - name: Authenticate to ECR (AWS CLI, static credentials)
        run: |
          set -euo pipefail
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Build Docker image (context = repository root, Dockerfile at .)
        run: |
          set -euo pipefail
          docker build \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:${{ steps.meta.outputs.image_tag }}" \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:latest" \
            -f Dockerfile .

      - name: Container smoke test (nginx :80 + node :8000 inside container)
        run: |
          set -euo pipefail
          docker run -d --name smoke -p 8080:80 -e PORT="$BACKEND_PORT" -e GROQ_API_KEY="" "$ECR_REGISTRY/$ECR_REPOSITORY:${{ steps.meta.outputs.image_tag }}"
          CODE="000"
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/ || true)
            [ "$CODE" = "200" ] && break
            sleep 2
          done
          [ "$CODE" = "200" || { docker logs smoke; echo "Smoke test failed with HTTP $CODE"; exit 1; }
          API_CODE=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/raw-topology || true)
          echo "GET /api/raw-topology through nginx proxy -> HTTP $API_CODE"
          [ "$API_CODE" = "200" ] || { docker logs smoke; echo "API proxy smoke test failed"; exit 1; }
          docker stop smoke || true
          docker rm smoke || true
          echo "Container smoke test passed"

      - name: Push Docker images to ECR
        run: |
          set -euo pipefail
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:${{ steps.meta.outputs.image_tag }}"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"

  deploy:
    name: Deploy to EC2 via SSM RunShellScript
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Write SSM commands payload to JSON file
        run: |
          set -euo pipefail
          cat > /tmp/ssm-params.json << 'SSMPARAMS'
          {
            "commands": [
              "set -euo pipefail",
              "export AWS_REGION=ap-south-1",
              "export ECR_REGISTRY=759204735992.dkr.ecr.ap-south-1.amazonaws.com",
              "export IMAGE_URI=${{ needs.build.outputs.image_uri }}",
              "aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY",
              "docker pull $IMAGE_URI",
              "docker stop app || true",
              "docker rm app || true",
              "ENV_FILE=/opt/app/.env",
              "mkdir -p /opt/app",
              "if [ ! -f $ENV_FILE ]; then aws secretsmanager get-secret-value --secret-id deptic/AI_Topology-Builder/secrets --region $AWS_REGION --query SecretString --output text > $ENV_FILE || cp /dev/null $ENV_FILE; fi",
              "chmod 600 $ENV_FILE || true",
              "docker run -d --restart always --name app -p 80:80 -e PORT=8000 --env-file $ENV_FILE $IMAGE_URI",
              "docker ps --filter name=app --format '{{.Names}} {{.Status}}'"
            ]
          }
          SSMPARAMS
          echo "--- ssm-params.json ---"
          cat /tmp/ssm-params.json

      - name: Send SSM command to EC2 instance
        run: |
          set -euo pipefail
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --region "$AWS_REGION" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" --output text)
          echo "COMMAND_ID=$COMMAND_ID"
          echo "COMMAND_ID=$COMMAND_ID" >> "$GITHUB_ENV"

      - name: Wait for SSM command completion
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --region "$AWS_REGION" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "SSM status: $STATUS"
            case "$STATUS" in
              Success) echo "SSM command succeeded"; exit 0 ;;
              InProgress|Pending|Delayed) sleep 5 ;;
              *) echo "SSM command failed with status $STATUS"
                 aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$AWS_REGION || true
                 exit 1 ;;
            esac
          done
          echo "Timed out waiting for SSM command"
          exit 1

  verify:
    name: Public Health Check
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Wait for nginx + node to come up on instance
        run: sleep 10

      - name: Health check public URL (HTTP 200 required)
        run: |
          set -euo pipefail
          CODE="000"
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' "$PUBLIC_URL/" || true)
            echo "Attempt $i: HTTP $CODE"
            [ "$CODE" = "200" ] && break
            sleep 5
          done
          if [ "$CODE" != "200" ]; then
            echo "Health check failed: expected 200, got $CODE"
            exit 1
          fi
          echo "Public health check passed: $PUBLIC_URL -> HTTP 200"

      - name: Verify backend API proxy through nginx
        run: |
          set -euo pipefail
          API_CODE=$(curl -s -o /dev/null -w '%{http_code}' "$PUBLIC_URL/api/raw-topology" || true)
          echo "GET $PUBLIC_URL/api/raw-topology -> HTTP $API_CODE"
          if [ "$API_CODE" != "200" ]; then
            echo "API health check failed: expected 200, got $API_CODE"
            exit 1
          fi
          curl -s "$PUBLIC_URL/api/raw-topology" | head -c 400
          echo ""
          echo "Backend API verification passed"