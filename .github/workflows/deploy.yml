name: Deploy to EC2 Docker

on:
  push:
    branches: [main]
    tags: ['*']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      REGION: ap-south-1
      ECR_REGISTRY: 759204735992.dkr.ecr.ap-south-1.amazonaws.com
      ECR_REPOSITORY: ai-topology-builder
      INSTANCE_ID: i-05117d1e50047cbeb
      PUBLIC_URL: http://52.66.40.31
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine image tag
        id: tag
        run: echo "IMAGE_TAG=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

      - name: Build Docker image
        run: |
          IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          echo "Building image $IMAGE"
          docker build -t "$IMAGE" .
          echo "::set-output name=IMAGE_URI::$IMAGE"

      - name: Log in to Amazon ECR
        env:
          ECR_REGISTRY: ${{ env.ECR_REGISTRY }}
          AWS_REGION: ${{ env.REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          aws ecr get-login-password --region "$AWS_REGION" |
            docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Push Docker image
        run: |
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          echo "Pushing image $IMAGE_URI"
          docker push "$IMAGE_URI"

      - name: Prepare SSM command parameters
        run: |
          cat > /tmp/ssm-params.json <<'SSMPARAMS'
          {
            "commands": [
              "aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $ECR_REGISTRY",
              "docker pull $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always -p 80:80 --name app $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
            ]
          }
          SSMPARAMS

      - name: Deploy to EC2 via SSM
        env:
          REGIONAL: ${{ env.REGION }}
          INSTANCE_ID: ${{ env.INSTANCE_ID }}
          ECR_REGISTRY: ${{ env.ECR_REGISTRY }}
          ECR_REPOSITORY: ${{ env.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ steps.tag.outputs.IMAGE_TAG }}
        run: |
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --region "$REGIONAL" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" --output text)
          echo "SSM Command ID: $CMD_ID"

      - name: Wait for deployment to initialize
        run: sleep 60

      - name: Health check
        run: |
          for i in {1..10}; do
            if curl --fail --silent -o /dev/null "$PUBLIC_URL"; then
              echo "Health check succeeded."
              exit 0
            else
              echo "Attempt $i: health check failed, retrying..."
              sleep 5
            fi
          done
          echo "Health check failed after retries."
          exit 1