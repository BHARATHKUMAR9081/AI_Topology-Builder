name: Deploy to EC2 Docker

on:
  push:
    branches: [main]
    tags: ['*']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      REGION: ap-south-1
      INSTANCE_ID: i-05117d1e50047cbeb
      ECR_REPOSITORY_URI: 759204735992.dkr.ecr.ap-south-1.amazonaws.com/ai-topology-builder
      PUBLIC_URL: http://52.66.40.31
      CONTAINER_PORT: 80
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine image tag
        id: tag
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

      - name: Build Docker image
        run: |
          docker build -t "${ECR_REPOSITORY_URI}:${{ steps.tag.outputs.IMAGE_TAG }}" .

      - name: Install AWS CLI
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y awscli

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region "${REGION}" | docker login --username AWS --password-stdin "$(echo ${ECR_REPOSITORY_URI} | cut -d'/' -f1)"

      - name: Push image to ECR
        run: |
          docker push "${ECR_REPOSITORY_URI}:${{ steps.tag.outputs.IMAGE_TAG }}"

      - name: Deploy to EC2 via SSM
        run: |
          set -e
          IMAGE_URI="${ECR_REPOSITORY_URI}:${{ steps.tag.outputs.IMAGE_TAG }}"
          ECR_REGISTRY="$(echo ${ECR_REPOSITORY_URI} | cut -d'/' -f1)"
          cat > /tmp/ssm-params.json <<EOF
          {
            "commands": [
              "aws ecr get-login-password --region ${REGION} | docker login --username AWS --password-stdin ${ECR_REGISTRY}",
              "docker pull ${IMAGE_URI}",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always -p 80:80 --name app ${IMAGE_URI}"
            ]
          }
          EOF
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --region "${REGION}" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" --output text)
          echo "SSM Command ID: $COMMAND_ID"

      - name: Wait for deployment to initialize
        run: sleep 60

      - name: Health check
        run: |
          for i in {1..10}; do
            if curl --fail --silent -o /dev/null "${PUBLIC_URL}"; then
              echo "Health check succeeded."
              exit 0
            else
              echo "Attempt $i: health check failed, retrying..."
              sleep 5
            fi
          done
          echo "Health check failed after retries."
          exit 1