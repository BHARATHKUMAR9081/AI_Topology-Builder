name: Deploy to EC2 Docker

on:
  push:
    branches: [main]
    tags: ['*']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine image tag
        id: tag
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

      - name: Build Docker image
        run: |
          IMAGE_TAG=${{ steps.tag.outputs.IMAGE_TAG }}
          docker build -t "759204735992.dkr.ecr.ap-south-1.amazonaws.com/ai-topology-builder:$IMAGE_TAG" .

      - name: Install AWS CLI
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y awscli

      - name: Configure AWS credentials
        run: |
          echo "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}" >> $GITHUB_ENV
          echo "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}" >> $GITHUB_ENV
          echo "AWS_REGION=ap-south-1" >> $GITHUB_ENV

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin 759204735992.dkr.ecr.ap-south-1.amazonaws.com

      - name: Push Docker image
        run: |
          IMAGE_TAG=${{ steps.tag.outputs.IMAGE_TAG }}
          docker push "759204735992.dkr.ecr.ap-south-1.amazonaws.com/ai-topology-builder:$IMAGE_TAG"

      - name: Deploy to EC2 via SSM
        run: |
          set -e
          IMAGE_URI="759204735992.dkr.ecr.ap-south-1.amazonaws.com/ai-topology-builder:${{ steps.tag.outputs.IMAGE_TAG }}"
          INSTANCE_ID="i-05117d1e50047cbeb"
          REGION="ap-south-1"
          ECR_REGISTRY="759204735992.dkr.ecr.ap-south-1.amazonaws.com"

          cat > /tmp/ssm-params.json <<EOF
          {
            "commands": [
              "aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $ECR_REGISTRY",
              "docker pull $IMAGE_URI",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always -p 80:80 --name app $IMAGE_URI"
            ]
          }
          EOF

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --region "$REGION" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" --output text)

          echo "SSM Command ID: $COMMAND_ID"

      - name: Wait for deployment to initialize
        run: sleep 60

      - name: Health check
        run: |
          for i in {1..10}; do
            if curl --fail --silent -o /dev/null http://52.66.40.31; then
              echo "Health check succeeded."
              exit 0
            else
              echo "Attempt $i: health check failed, retrying..."
              sleep 5
            fi
          done
          echo "Health check failed after retries."
          exit 1