name: Build and Deploy AI Topology Builder to EC2 Docker

on:
  push:
    branches: [ main ]
    tags: ['*']
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      REGION: ap-south-1
      INSTANCE_ID: i-05117d1e50047cbeb
      PUBLIC_URL: http://52.66.40.31
      DETECTED_CONTAINER_PORT: 80
      ECR_REPOSITORY_URI: 759204735992.dkr.ecr.ap-south-1.amazonaws.com/ai-topology-builder
      DOCKERFILE_PATH: .
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine image tag and URI
        id: image
        run: |
          IMAGE_TAG=${GITHUB_SHA::8}
          echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          IMAGE_URI="${ECR_REPOSITORY_URI}:${IMAGE_TAG}"
          echo "IMAGE_URI=${IMAGE_URI}" >> $GITHUB_OUTPUT

      - name: Build Docker image
        run: |
          docker build -t "${{ steps.image.outputs.IMAGE_URI }}" .

      - name: Install AWS CLI
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y awscli

      - name: Push image to ECR
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          ECR_REGISTRY=$(echo "${{ steps.image.outputs.IMAGE_URI }}" | cut -d'/' -f1)
          aws ecr get-login-password --region "$REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
          docker push "${{ steps.image.outputs.IMAGE_URI }}"

      - name: Deploy to EC2 instance via SSM
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          set -e
          IMAGE_URI="${{ steps.image.outputs.IMAGE_URI }}"
          ECR_REGISTRY=$(echo "$IMAGE_URI" | cut -d'/' -f1)
          cat > /tmp/ssm-params.json <<EOF
          {
            "commands": [
              "aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $ECR_REGISTRY",
              "docker pull $IMAGE_URI",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always -p $DETECTED_CONTAINER_PORT:$DETECTED_CONTAINER_PORT --name app $IMAGE_URI"
            ]
          }
          EOF
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --region "$REGION" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" --output text)
          echo "SSM Command ID: $COMMAND_ID"

      - name: Wait for deployment to initialize
        run: sleep 60

      - name: Health check
        run: |
          for i in {1..10}; do
            if curl --fail --silent -o /dev/null "$PUBLIC_URL"; then
              echo "Health check succeeded."
              exit 0
            else
              echo "Attempt $i: health check failed, retrying..."
              sleep 5
            fi
          done
          echo "Health check failed after retries."
          exit 1