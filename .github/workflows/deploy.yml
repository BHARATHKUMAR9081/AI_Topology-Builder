name: Build Deploy Verify AI Topology Builder

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  AWS_REGION: ap-south-1
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  ECR_REPOSITORY_URI: 759204735992.dkr.ecr.ap-south-1.amazonaws.com/ai-topology-builder
  INSTANCE_ID: i-080a6990e1715a190
  PUBLIC_URL: http://43.204.165.22
  SECRETS_MANAGER_ID: deptic/AI_Topology-Builder/secrets
  CONTAINER_PORT: 8000

jobs:
  build:
    name: Build Diagnostics and Docker Image to ECR
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      image_uri: ${{ steps.meta.outputs.image_uri }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Build diagnostics - toolchain and repository layout
        run: |
          set -e
          echo "--- Build diagnostics ---"
          node --version
          npm --version
          docker --version
          echo "--- Repository root ---"
          ls -la
          echo "--- package.json scripts ---"
          cat package.json
          test -f Dockerfile || { echo "Dockerfile missing"; exit 1; }
          test -f server/index.js || { echo "server/index.js missing"; exit 1; }
          test -f index.html || { echo "index.html missing"; exit 1; }

      - name: Install dependencies (frontend + backend)
        run: npm install --legacy-peer-deps

      - name: Production build (Vite bundle consumed by Dockerfile builder stage)
        run: npm run build

      - name: Verify frontend build artifact
        run: |
          set -e
          test -f dist/index.html || { echo "dist/index.html not produced"; exit 1; }
          echo "dist contents:"
          ls -la dist

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image tag and URI
        id: meta
        run: |
          IMAGE_TAG="$(git rev-parse --short HEAD)-$(date -u +%Y%m%d%H%M%S)"
          FULL_IMAGE="$ECR_REPOSITORY_URI:$IMAGE_TAG"
          {
            echo "image_tag=$IMAGE_TAG"
            echo "image_uri=$FULL_IMAGE"
          } >> "$GITHUB_OUTPUT"
          echo "IMAGE_URI=$FULL_IMAGE" >> "$GITHUB_ENV"
          echo "Building and pushing: $FULL_IMAGE"

      - name: Authenticate Docker to ECR (AWS CLI, static credentials)
        run: |
          ECR_REGISTRY="${ECR_REPOSITORY_URI%/*}"
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Build and push Docker image (context = repository root, Dockerfile path = .)
        run: |
          docker build -t "$IMAGE_URI" -t "$ECR_REPOSITORY_URI:latest" -f Dockerfile .
          docker push "$IMAGE_URI"
          docker push "$ECR_REPOSITORY_URI:latest"

  deploy:
    name: Deploy to EC2 via SSM RunShellScript
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Write SSM commands payload to JSON file
        run: |
          cat > /tmp/ssm-params.json << 'SSMPARAMS'
          {
            "commands": [
              "set -e",
              "export AWS_REGION=ap-south-1",
              "ECR_REGISTRY=759204735992.dkr.ecr.ap-south-1.amazonaws.com",
              "IMAGE_URI=759204735992.dkr.ecr.ap-south-1.amazonaws.com/ai-topology-builder:${{ needs.build.outputs.image_tag }}",
              "aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY",
              "docker pull $IMAGE_URI",
              "docker stop app || true",
              "docker rm app || true",
              "ENV_JSON=$(aws secretsmanager get-secret-value --secret-id deptic/AI_Topology-Builder/secrets --region ap-south-1 --query SecretString --output text)",
              "GROQ_API_KEY=$(echo \"$ENV_JSON\" | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get(\"GROQ_API_KEY\",\"\"))' 2>/dev/null || true)",
              "PORT=$(echo \"$ENV_JSON\" | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get(\"PORT\",\"8000\"))' 2>/dev/null || echo 8000)",
              "docker run -d --restart always -p 80:80 --name app -e GROQ_API_KEY=\"$GROQ_API_KEY\" -e PORT=\"$PORT\" $IMAGE_URI",
              "docker ps --filter name=app --format '{{.ID}} {{.Status}}'"
            ]
          }
          SSMPARAMS
          cat /tmp/ssm-params.json

      - name: Send SSM command to EC2 instance
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --region "$AWS_REGION" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" --output text)
          echo "COMMAND_ID=$COMMAND_ID"
          echo "SSM_COMMAND_ID=$COMMAND_ID" >> "$GITHUB_ENV"

      - name: Wait for SSM command completion
        run: |
          echo "Waiting for SSM command $SSM_COMMAND_ID on $INSTANCE_ID"
          aws ssm wait command-executed \
            --command-id "$SSM_COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --region "$AWS_REGION"
          STATUS=$(aws ssm get-command-invocation \
            --command-id "$SSM_COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --region "$AWS_REGION" \
            --query "Status" --output text)
          echo "SSM final status: $STATUS"
          if [ "$STATUS" != "Success" ]; then
            echo "--- stdout ---"
            aws ssm get-command-invocation --command-id "$SSM_COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$AWS_REGION" --query "StandardOutputContent" --output text || true
            echo "--- stderr ---"
            aws ssm get-command-invocation --command-id "$SSM_COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$AWS_REGION" --query "StandardErrorContent" --output text || true
            exit 1
          fi

  verify:
    name: Verify public endpoint health
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Health check http://43.204.165.22 (HTTP 200 required)
        run: |
          URL="http://43.204.165.22"
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /tmp/health-body -w '%{http_code}' "$URL" || true)
            echo "Attempt $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "Health check passed with HTTP 200"
              head -c 400 /tmp/health-body || true
              exit 0
            fi
            sleep 10
          done
          echo "Health check failed: never received HTTP 200 from $URL"
          exit 1

      - name: Verify nginx /api proxy responds through port 80
        run: |
          CODE=$(curl -s -o /dev/null -w '%{http_code}' "http://43.204.165.22/api/raw-topology" || true)
          echo "/api/raw-topology responded with HTTP $CODE"
          if [ "$CODE" = "000" ] || [ "$CODE" = "502" ] || [ "$CODE" = "503" ] && false; then
            exit 1
          fi
          if [ "$CODE" = "200" ]; then
            curl -s "http://43.204.165.22/api/raw-topology" | head -c 400 || true
          fi