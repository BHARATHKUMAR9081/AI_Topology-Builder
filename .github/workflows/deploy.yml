name: Build Deploy Verify AI Topology Builder

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 759204735992.dkr.ecr.ap-south-1.amazonaws.com
  ECR_REPOSITORY: ai-topology-builder
  INSTANCE_ID: i-0a00d5f35e546e425
  PUBLIC_URL: http://13.234.150.98
  CONTAINER_PORT: "8000"
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

jobs:
  build:
    name: Build Diagnostics and Docker Image
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      image_uri: ${{ steps.meta.outputs.image_uri }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Build diagnostics
        run: |
          set -euo pipefail
          echo "--- node/npm versions ---"
          node --version
          npm --version
          echo "--- repository layout ---"
          ls -la
          echo "--- package.json scripts ---"
          node -e "console.log(JSON.stringify(require('./package.json').scripts, null, 2))"
          test -f server/index.js && echo "server/index.js present"
          test -f index.html && echo "index.html (Vite entry) present"
          test -f Dockerfile && echo "Dockerfile present"

      - name: Install dependencies and production build (Vite)
        run: |
          set -euo pipefail
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps
          npm run build
          test -f dist/index.html && echo "dist/index.html built successfully"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image tag and URI
        id: meta
        run: |
          set -euo pipefail
          IMAGE_TAG="$(git rev-parse --short HEAD)-$(date -u +%Y%m%d%H%M%S)"
          FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "image_uri=$FULL_IMAGE:$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "FULL_IMAGE=$FULL_IMAGE" >> "$GITHUB_ENV"

      - name: Authenticate to ECR (AWS CLI, static credentials)
        run: |
          set -euo pipefail
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Build Docker image (context = repository root, Dockerfile at .)
        run: |
          set -euo pipefail
          docker build -t "$ECR_REGISTRY/$ECR_REPOSITORY:${{ steps.meta.outputs.image_tag }}" -t "$ECR_REGISTRY/$ECR_REPOSITORY:latest" .

      - name: Container smoke test (nginx :80 + node :8000 inside container)
        run: |
          set -euo pipefail
          docker run -d --name smoke -p 8080:80 -e PORT="$CONTAINER_PORT" -e GROQ_API_KEY="" "$ECR_REGISTRY/$ECR_REPOSITORY:${{ steps.meta.outputs.image_tag }}"
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/ || true)
            [ "$CODE" = "200" ] && break
            sleep 2
          done
          [ "$CODE" = "200" ] || { docker logs smoke; echo "Smoke test failed with HTTP $CODE"; exit 1; }
          echo "Container smoke test passed with HTTP 200"
          API_CODE=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/raw-topology || true)
          echo "Backend /api/raw-topology via nginx proxy returned HTTP $API_CODE"
          docker rm -f smoke

      - name: Push image to ECR
        run: |
          set -euo pipefail
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:${{ steps.meta.outputs.image_tag }}"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"

  deploy:
    name: Deploy to EC2 via SSM
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Write SSM commands payload to JSON file
        env:
          IMAGE_URI: ${{ needs.build.outputs.image_uri }}
        run: |
          cat > /tmp/ssm-params.json << 'SSMPARAMS'
          {
            "commands": [
              "set -euo pipefail",
              "export REGION=ap-south-1",
              "export ECR_REGISTRY=759204735992.dkr.ecr.ap-south-1.amazonaws.com",
              "export IMAGE_URI=${IMAGE_URI}",
              "aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $ECR_REGISTRY",
              "docker pull $IMAGE_URI",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always --name app -p 80:80 -e PORT=8000 -e BACKEND_PORT=8000 -e FRONTEND_PORT=80 -e GROQ_API_KEY=$(aws secretsmanager get-secret-value --secret-id deptic/AI_Topology-Builder/secrets --region $REGION --query SecretString --output text | node -e \"let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{try{const s=JSON.parse(d);console.log(s.GROQ_API_KEY||'')}catch(e){console.log(d.trim())}}\")",
              "docker image prune -f || true"
            ]
          }
          SSMPARAMS

      - name: Send SSM command to EC2 instance
        env:
          IMAGE_URI: ${{ needs.build.outputs.image_uri }}
        run: |
          set -euo pipefail
          echo "Deploying image: $IMAGE_URI"
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --region "$AWS_REGION" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" --output text)
          echo "COMMAND_ID=$COMMAND_ID"
          echo "COMMAND_ID=$COMMAND_ID" >> "$GITHUB_ENV"

      - name: Wait for SSM command completion
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            STATUS=$(aws ssm list-commands --command-id "$COMMAND_ID" --region "$AWS_REGION" --query "Commands[0].Status" --output text)
            echo "SSM status: $STATUS"
            case "$STATUS" in
              Success) echo "Deploy command succeeded"; exit 0 ;;
              Failed|Cancelled|TimedOut) echo "Deploy command failed with status $STATUS"; exit 1 ;;
            esac
            sleep 10
          done
          echo "Timed out waiting for SSM command"; exit 1

  verify:
    name: Verify production health
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Health check public URL (HTTP 200 required)
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' "$PUBLIC_URL/" || true)
            echo "Attempt $i: HTTP $CODE"
            [ "$CODE" = "200" ] && break
            sleep 5
          done
          if [ "$CODE" != "200" ]; then echo "Health check failed: HTTP $CODE"; exit 1; fi
          echo "Health check passed: HTTP 200 from $PUBLIC_URL/"

      - name: Verify backend API proxy through nginx
        run: |
          set -euo pipefail
          API_CODE=$(curl -s -o /dev/null -w '%{http_code}' "$PUBLIC_URL/api/raw-topology" || true)
          echo "GET /api/raw-topology -> HTTP $API_CODE"
          if [ "$API_CODE" != "200" ]; then echo "Backend proxy check failed"; exit 1; fi
          curl -s "$PUBLIC_URL/api/raw-topology" | head -c 300
          echo ""
          echo "Verification complete: frontend and backend healthy at $PUBLIC_URL"