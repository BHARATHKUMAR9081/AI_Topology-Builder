name: Build Deploy Verify AI Topology Builder

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  AWS_REGION: ap-south-1
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  ECR_REPOSITORY_URI: 759204735992.dkr.ecr.ap-south-1.amazonaws.com/ai-topology-builder
  INSTANCE_ID: i-0dc19e4f505aeba07
  PUBLIC_URL: http://13.205.250.122
  SECRETS_MANAGER_ID: deptic/AI_Topology-Builder/secrets
  CONTAINER_PORT: "80"

jobs:
  build:
    name: Build Diagnostics and Docker Image to ECR
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      image_uri: ${{ steps.meta.outputs.image_uri }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies (dev deps for Vite build)
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Build diagnostics (production bundle via vite build)
        run: |
          set -euo pipefail
          node --version
          npm --version
          test -f package.json
          test -f index.html
          test -f vite.config.js
          test -f server/index.js
          test -f src/main.jsx
          test -f src/App.jsx
          npm run build
          test -f dist/index.html
          ls -la dist
          ls -la dist/assets || true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials (static keys via AWS CLI)
        run: |
          set -euo pipefail
          REGION="$AWS_REGION"
          aws --version
          aws sts get-caller-identity

      - name: Login to Amazon ECR (direct AWS CLI)
        run: |
          set -euo pipefail
          REGION="$AWS_REGION"
          ECR_REGISTRY="${ECR_REPOSITORY_URI%%/*}"
          aws ecr get-login-password --region "$REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Compute image tag and URI
        id: meta
        run: |
          set -euo pipefail
          IMAGE_TAG="${GITHUB_SHA}"
          FULL_IMAGE="$ECR_REPOSITORY_URI:${IMAGE_TAG}"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "image_uri=${FULL_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "FULL_IMAGE=${FULL_IMAGE}" >> "$GITHUB_ENV"

      - name: Build Docker image (context ., Dockerfile at repo root)
        run: |
          set -euo pipefail
          docker build -t "$FULL_IMAGE" -f Dockerfile .
          docker images "$FULL_IMAGE"

      - name: Tag image as latest
        run: |
          set -euo pipefail
          docker tag "$FULL_IMAGE" "$ECR_REPOSITORY_URI:latest"

      - name: Push image to ECR
        run: |
          set -euo pipefail
          docker push "$FULL_IMAGE"
          docker push "$ECR_REPOSITORY_URI:latest" || true

  deploy:
    name: Deploy to EC2 Docker via SSM
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials (static keys via AWS CLI)
        run: |
          set -euo pipefail
          aws --version
          aws sts get-caller-identity

      - name: Resolve secrets from AWS Secrets Manager (GROQ_API_KEY)
        id: secrets
        run: |
          set -euo pipefail
          REGION="$AWS_REGION"
          SECRET_STRING="$(aws secretsmanager get-secret-value --secret-id "$SECRETS_MANAGER_ID" --region "$REGION" --query SecretString --output text)"
          GROQ_API_KEY="$(printf '%s' "$SECRET_STRING" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{try{const o=JSON.parse(d);process.stdout.write(o.GROQ_API_KEY||'');}catch(e){process.stdout.write('');}})")"
          if [ -n "$GROQ_API_KEY" ]; then
            echo "groq_configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "groq_configured=false" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "SECRET_ENV_FILE<<'EOFSECRET'"
            if [ -n "$GROQ_API_KEY" ]; then
              echo "GROQ_API_KEY=$GROQ_API_KEY"
            fi
            echo "PORT=8000"
            echo "EOFSECRET"
          } >> "$GITHUB_OUTPUT"

      - name: Write SSM command payload to JSON file
        env:
          IMAGE_URI: ${{ needs.build.outputs.image_uri }}
          SECRET_ENV_FILE: ${{ steps.secrets.outputs.SECRET_ENV_FILE }}
        run: |
          set -euo pipefail
          REGION="$AWS_REGION"
          ECR_REGISTRY="${ECR_REPOSITORY_URI%%/*}"
          cat > /tmp/ssm-params.json << 'SSMPARAMS'
          {
            "commands": [
              "set -euo pipefail",
              "export AWS_DEFAULT_REGION=ap-south-1",
              "aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 759204735992.dkr.ecr.ap-south-1.amazonaws.com",
              "docker pull 759204735992.dkr.ecr.ap-south-1.amazonaws.com/ai-topology-builder:IMAGE_TAG_PLACEHOLDER",
              "docker stop app || true",
              "docker rm app || true",
              "cat > /tmp/app.env << 'ENVEOF'",
              "SECRET_ENV_PLACEHOLDER",
              "ENVEOF",
              "docker run -d --restart always -p 80:80 --name app --env-file /tmp/app.env 759204735992.dkr.ecr.ap-south-1.amazonaws.com/ai-topology-builder:IMAGE_TAG_PLACEHOLDER",
              "docker ps --filter name=app"
            ]
          }
          SSMPARAMS
          sed -i "s|IMAGE_TAG_PLACEHOLDER|${IMAGE_TAG}|g" /tmp/ssm-params.json
          python3 - << 'PYEOF'
          import json, os
          with open('/tmp/ssm-params.json') as f:
              payload = json.load(f)
          env_file = os.environ.get('SECRET_ENV_FILE', '')
          env_lines = [line for line in env_file.splitlines() if line.strip()]
          commands = []
          for cmd in payload['commands']:
              if cmd == 'SECRET_ENV_PLACEHOLDER':
                  commands.extend(env_lines if env_lines else ['# no extra env secrets resolved'])
              else:
                  commands.append(cmd)
          payload['commands'] = commands
          with open('/tmp/ssm-params.json', 'w') as f:
              json.dump(payload, f, indent=2)
          PYEOF
          cat /tmp/ssm-params.json

      - name: Send SSM command to EC2 instance
        run: |
          set -euo pipefail
          REGION="$AWS_REGION"
          COMMAND_ID=$(aws ssm send-command --instance-ids "$INSTANCE_ID" --region "$REGION" --document-name "AWS-RunShellScript" --parameters file:///tmp/ssm-params.json --query "Command.CommandId" --output text)
          echo "COMMAND_ID=${COMMAND_ID}" >> "$GITHUB_ENV"
          echo "Dispatched SSM command: ${COMMAND_ID}"

      - name: Wait for SSM command completion
        run: |
          set -euo pipefail
          REGION="$AWS_REGION"
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$REGION"
          STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$REGION" --query Status --output text)
          echo "SSM command status: ${STATUS}"
          if [ "$STATUS" != "Success" ]; then
            aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$REGION"
            exit 1
          fi

  verify:
    name: Verify Public Health Endpoint
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Health check public URL until HTTP 200
        run: |
          set -euo pipefail
          URL="$PUBLIC_URL"
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' "$URL" || true)
            echo "Attempt $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "Health check passed with HTTP 200"
              exit 0
            fi
            sleep 10
          done
          echo "Health check failed: never received HTTP 200"
          exit 1

      - name: Verify API proxy route responds
        run: |
          set -euo pipefail
          CODE=$(curl -s -o /dev/null -w '%{http_code}' "$PUBLIC_URL/api/raw-topology" || true)
          echo "API route HTTP $CODE"
          if [ "$CODE" != "200" ]; then
            echo "API route not healthy"
            exit 1
          fi