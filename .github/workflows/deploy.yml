name: Deploy to EC2 via SSM

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      PUBLIC_URL: http://3.7.92.177
      REGION: ap-south-1
      INSTANCE_ID: i-03d0609dca0af1daa
      ECR_REPO_URI: 759204735992.dkr.ecr.ap-south-1.amazonaws.com/ai-topology-builder
      IMAGE_TAG: latest
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Compute Docker image URI
        run: |
          ECR_REGISTRY="${{ env.ECR_REPO_URI%%/*}}"
          ECR_REPOSITORY="${{ env.ECR_REPO_URI##*/}}"
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          echo "ECR_REGISTRY=$ECR_REGISTRY" >> $GITHUB_ENV
          echo "ECR_REPOSITORY=$ECR_REPOSITORY" >> $GITHUB_ENV
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV

      - name: Log in to Amazon ECR
        run: |
          echo "Logging into ECR registry $ECR_REGISTRY"
          aws ecr get-login-password --region "$REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -t "$IMAGE_URI" .

      - name: Push Docker image to ECR
        run: |
          docker push "$IMAGE_URI"

      - name: Prepare SSM deployment script
        run: |
          cat > /tmp/ssm-params.json << EOF
          {
            "commands": [
              "aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $ECR_REGISTRY",
              "docker pull $IMAGE_URI",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always -p 80:80 --name app $IMAGE_URI"
            ]
          }
          EOF

      - name: Deploy container to EC2 via SSM
        run: |
          echo "Sending SSM command to instance $INSTANCE_ID"
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --region "$REGION" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" \
            --output text)
          echo "SSM Command ID: $COMMAND_ID"

      - name: Health check
        run: |
          echo "Waiting for deployment to stabilize..."
          sleep 30
          echo "Checking health at $PUBLIC_URL"
          curl -fL "$PUBLIC_URL" || exit 1