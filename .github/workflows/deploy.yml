name: Deploy AI Topology Builder to EC2 Docker

on:
  push:
    branches: [ main ]
    tags: ['*']
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    # These constants come from the execution contract
    env:
      REGION: ap-south-1
      INSTANCE_ID: i-05117d1e50047cbeb
      ECR_REGISTRY: 759204735992.dkr.ecr.ap-south-1.amazonaws.com
      ECR_REPOSITORY: ai-topology-builder
      PUBLIC_URL: http://52.66.40.31

    steps:
      # -----------------------------------------------------------------------
      # 1. Checkout the repository
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # 2. Set up Node.js (required for npm package resolution used by Dockerfile)
      # -----------------------------------------------------------------------
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # -----------------------------------------------------------------------
      # 3. Set up Docker Buildx (optional but speeds up multi‑arch builds)
      # -----------------------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # -----------------------------------------------------------------------
      # 4. Determine image tag and URI
      # -----------------------------------------------------------------------
      - name: Set image tag and URI
        run: |
          IMAGE_TAG=${GITHUB_SHA::8}
          ECR_REGISTRY=759204735992.dkr.ecr.ap-south-1.amazonaws.com
          ECR_REPOSITORY=ai-topology-builder
          ECR_REPOSITORY_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}"
          IMAGE_URI="${ECR_REPOSITORY_URI}:${IMAGE_TAG}"
          echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_ENV
          echo "IMAGE_URI=${IMAGE_URI}" >> $GITHUB_ENV

      # -----------------------------------------------------------------------
      # 5. Build the Docker image
      # -----------------------------------------------------------------------
      - name: Build Docker image
        run: |
          docker build -t "${IMAGE_URI}" .

      # -----------------------------------------------------------------------
      # 6. Install AWS CLI (required for ECR and SSM operations)
      # -----------------------------------------------------------------------
      - name: Install AWS CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y awscli

      # -----------------------------------------------------------------------
      # 7. Login to Amazon ECR
      # -----------------------------------------------------------------------
      - name: Log in to Amazon ECR
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          aws ecr get-login-password --region "${REGION}" | \
          docker login --username AWS --password-stdin "${ECR_REGISTRY}"

      # -----------------------------------------------------------------------
      # 8. Push the Docker image to ECR
      # -----------------------------------------------------------------------
      - name: Push image to ECR
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          docker push "${IMAGE_URI}"

      # -----------------------------------------------------------------------
      # 9. Deploy the container to the EC2 instance via SSM
      # -----------------------------------------------------------------------
      - name: Deploy via SSM
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          REGION: "${REGION}"
          INSTANCE_ID: "${INSTANCE_ID}"
          IMAGE_URI: "${IMAGE_URI}"
          ECR_REGISTRY: "${ECR_REGISTRY}"
        run: |
          # Create the SSM script payload
          cat > /tmp/ssm-params.json <<'SSMPARAMS'
          {
            "commands": [
              "aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $ECR_REGISTRY",
              "docker pull $IMAGE_URI",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always -p 80:80 --name app $IMAGE_URI"
            ]
          }
          SSMPARAMS

          # Send the SSM command and capture the Command ID
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --region "$REGION" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" --output text)

          echo "SSM Command ID: $COMMAND_ID"

          # Wait for the command to finish
          for i in {1..30}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --region "$REGION" \
              --query "Status" --output text 2>/dev/null)

            if [[ "$STATUS" == "Success" ]]; then
              echo "Deployment succeeded."
              exit 0
            elif [[ "$STATUS" == "Failed" || "$STATUS" == "Cancelled" || "$STATUS" == "TimedOut" ]]; then
              echo "Deployment failed with status: $STATUS"
              exit 1
            else
              echo "Deployment status: $STATUS (waiting $i/30)..."
              sleep 5
            fi
          done

          echo "Deployment did not complete in time."
          exit 1

      # -----------------------------------------------------------------------
      # 10. Verify the application is serving HTTP 200
      # -----------------------------------------------------------------------
      - name: Verify deployment health
        run: |
          for i in {1..5}; do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${PUBLIC_URL}")
            if [ "$HTTP_STATUS" -eq 200 ]; then
              echo "HTTP 200 received – deployment verified."
              exit 0
            fi
            echo "Attempt $i: HTTP status $HTTP_STATUS, retrying in 5s..."
            sleep 5
          done
          echo "Health check failed after multiple attempts."
          exit 1