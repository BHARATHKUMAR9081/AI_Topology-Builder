# ci-deploy.yml
# GitHub Actions workflow for production deployment of AI Topology Builder to
# an EC2 container instance using AWS Systems Manager RunShellScript.
name: Deploy to EC2 via SSM

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      # Repository specific static values derived from the execution contract
      ECR_REPOSITORY_URI: "759204735992.dkr.ecr.ap-south-1.amazonaws.com/ai-topology-builder"
      REGION: "ap-south-1"
      INSTANCE_ID: "i-03d0609dca0af1daa"
      PUBLIC_URL: "http://3.7.92.177"
      # Secrets required for AWS CLI authentication
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: |
          echo "=== Building Vite production bundle ==="
          npm run build
          echo "=== Build completed ==="

      - name: Prepare Docker image metadata
        id: image_meta
        run: |
          # Compute parts of the image name
          ECR_REGISTRY="${{ env.ECR_REPOSITORY_URI%%/*}}"
          ECR_REPO="${{ env.ECR_REPOSITORY_URI##*/}}"
          IMAGE_TAG=latest
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPO}:${IMAGE_TAG}"
          echo "IMAGE_URI=${IMAGE_URI}" >> $GITHUB_ENV
          echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_ENV
          echo "ECR_REGISTRY=${ECR_REGISTRY}" >> $GITHUB_ENV
          echo "ECR_REPO=${ECR_REPO}" >> $GITHUB_ENV
          echo "Image URI: $IMAGE_URI"

      - name: Build Docker image
        run: |
          echo "=== Building Docker image ==="
          docker build -t ${{ env.IMAGE_URI }} .
          echo "=== Docker image built ==="

      - name: Push Docker image to ECR
        run: |
          echo "=== Pushing Docker image to ECR ==="
          echo "Logging into ECR with AWS CLI"
          aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin ${{ env.ECR_REGISTRY }}
          echo "Pushing ${{ env.IMAGE_URI }}"
          docker push ${{ env.IMAGE_URI }}
          echo "=== Docker image pushed ==="

      - name: Deploy container to EC2 via SSM
        run: |
          # Install AWS CLI if not present
          echo "=== Installing AWS CLI ==="
          sudo apt-get update
          sudo apt-get install -y awscli

          echo "=== Preparing SSM command payload ==="
          cat <<EOF > /tmp/ssm-params.json
          {
            "commands": [
              "aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin ${{ env.ECR_REGISTRY }}",
              "docker pull ${{ env.IMAGE_URI }}",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always -p 80:80 --name app ${{ env.IMAGE_URI }}"
            ]
          }
          EOF

          echo "=== Sending SSM command to instance $INSTANCE_ID ==="
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --region "$REGION" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" \
            --output text)

          echo "Command ID: $COMMAND_ID"
          echo "SSM_COMMAND_ID=${COMMAND_ID}" >> $GITHUB_ENV

          echo "=== Waiting for SSM command to complete ==="
          while true; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --region "$REGION" \
              --query "Status" \
              --output text)
            echo "Status: $STATUS"
            if [[ "$STATUS" == "Success" ]]; then break; fi
            if [[ "$STATUS" == "Failed" || "$STATUS" == "TimedOut" || "$STATUS" == "Cancelled" ]]; then
              echo "::error::SSM command ${STATUS}"
              exit 1
            fi
            sleep 5
          done
          echo "=== SSM deployment succeeded ==="

          # Give the container a moment to start
          echo "=== Waiting for container to initialize ==="
          sleep 30

      - name: Verify application health
        run: |
          echo "=== Performing health check on $PUBLIC_URL ==="
          for i in $(seq 1 10); do
            if curl -f -s "$PUBLIC_URL" > /dev/null; then
              echo "Health check succeeded."
              exit 0
            else
              echo "Health check failed attempt $i/10. Retrying..."
              sleep 10
            fi
          done
          echo "::error::Health check failed after 10 attempts."
          exit 1