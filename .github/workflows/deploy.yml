name: Build Deploy Verify AI Topology Builder

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  AWS_REGION: ap-south-1
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  ECR_REPOSITORY_URI: 759204735992.dkr.ecr.ap-south-1.amazonaws.com/ai-topology-builder
  INSTANCE_ID: i-0dc19e4f505aeba07
  PUBLIC_URL: http://13.205.250.122
  SECRETS_MANAGER_ID: deptic/AI_Topology-Builder/secrets
  CONTAINER_PORT: "80"

jobs:
  build:
    name: Build Diagnostics and Docker Image to ECR
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      image_uri: ${{ steps.meta.outputs.image_uri }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies (dev deps for Vite build)
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Build diagnostics (production bundle via vite build)
        run: |
          set -euo pipefail
          node --version
          npm --version
          test -f package.json
          test -f index.html
          test -f vite.config.js
          test -f server/index.js
          test -f src/main.jsx
          test -f src/App.jsx
          npm run build
          test -f dist/index.html
          ls -la dist
          ls -la dist/assets || true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials (static keys via AWS CLI)
        run: |
          set -euo pipefail
          REGION="$AWS_REGION"
          aws --version
          aws sts get-caller-identity

      - name: Login to Amazon ECR (direct AWS CLI)
        run: |
          set -euo pipefail
          REGION="$AWS_REGION"
          ECR_REGISTRY="${ECR_REPOSITORY_URI%%/*}"
          aws ecr get-login-password --region "$REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Compute image tag and URI
        id: meta
        run: |
          set -euo pipefail
          IMAGE_TAG="${GITHUB_SHA}"
          FULL_IMAGE="$ECR_REPOSITORY_URI:${IMAGE_TAG}"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "image_uri=${FULL_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "FULL_IMAGE=${FULL_IMAGE}" >> "$GITHUB_ENV"

      - name: Build Docker image (context ., Dockerfile at repo root)
        run: |
          set -euo pipefail
          docker build -t "$FULL_IMAGE" -f Dockerfile .
          docker images "$FULL_IMAGE"

      - name: Tag image as latest
        run: |
          set -euo pipefail
          docker tag "$FULL_IMAGE" "$ECR_REPOSITORY_URI:latest"

      - name: Push image to ECR
        run: |
          set -euo pipefail
          docker push "$FULL_IMAGE"
          docker push "$ECR_REPOSITORY_URI:latest" || true

  deploy:
    name: Deploy to EC2 Docker via SSM
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials (static keys via AWS CLI)
        run: |
          set -euo pipefail
          aws --version
          aws sts get-caller-identity

      - name: Resolve secrets from AWS Secrets Manager (GROQ_API_KEY)
        id: secrets
        run: |
          set -euo pipefail
          REGION="$AWS_REGION"
          SECRET_VALUE="$(aws secretsmanager get-secret-value --secret-id "$SECRETS_MANAGER_ID" --region "$REGION" --query SecretString --output text)"
          GROQ_API_KEY="$(printf '%s' "$SECRET_VALUE" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{try{const o=JSON.parse(d);console.log(o.GROQ_API_KEY||o.groq_api_key||'');}catch{console.log('');}})")" || GROQ_API_KEY=""
          PORT_VALUE="$(printf '%s' "$SECRET_VALUE" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{try{const o=JSON.parse(d);console.log(o.PORT||o.port||'');}catch{console.log('');}})")" || PORT_VALUE=""
          if [ -z "$PORT_VALUE" ]; then PORT_VALUE="8000"; fi
          {
            echo "GROQ_API_KEY=${GROQ_API_KEY}"
            echo "NODE_PORT=${PORT_VALUE}"
          } >> "$GITHUB_OUTPUT"
          echo "resolved GROQ_API_KEY present: $([ -n "$GQROQ_API_KEY" ] && echo yes || echo no)" || true

      - name: Write SSM command payload to JSON file
        env:
          IMAGE_URI: ${{ needs.build.outputs.image_uri }}
          GROQ_API_KEY: ${{ steps.secrets.outputs.GROQ_API_KEY }}
          NODE_PORT: ${{ steps.secrets.outputs.NODE_PORT }}
        run: |
          set -euo pipefail
          REGION="$AWS_REGION"
          ECR_REGISTRY="${ECR_REPOSITORY_URI%%/*}"
          cat > /tmp/ssm-params.json << SSMPARAMS
          {
            "commands": [
              "set -euo pipefail",
              "export AWS_DEFAULT_REGION=${REGION}",
              "aws ecr get-login-password --region ${REGION} | docker login --username AWS --password-stdin ${ECR_REGISTRY}",
              "docker pull ${IMAGE_URI}",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always --name app -p 80:80 -e PORT=${NODE_PORT} -e GROQ_API_KEY=${GROQ_API_KEY} -e NODE_ENV=production ${IMAGE_URI}",
              "docker ps --format '{{.Names}} {{.Status}}'"
            ]
          }
          SSMPARAMS
          cat /tmp/ssm-params.json

      - name: Send SSM command to EC2 instance
        run: |
          set -euo pipefail
          REGION="$AWS_REGION"
          COMMAND_ID=$(aws ssm send-command --instance-ids "$INSTANCE_ID" --region "$REGION" --document-name "AWS-RunShellScript" --parameters file:///tmp/ssm-params.json --query "Command.CommandId" --output text)
          echo "COMMAND_ID=${COMMAND_ID}" >> "$GITHUB_ENV"
          echo "Dispatched SSM command: ${COMMAND_ID}"

      - name: Wait for SSM command completion
        run: |
          set -euo pipefail
          REGION="$AWS_REGION"
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$REGION"
          STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$REGION" --query Status --output text)
          echo "SSM command status: ${STATUS}"
          if [ "$STATUS" != "Success" ]; then
            aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$REGION" --query StandardError --output text || true
            exit 1
          fi

  verify:
    name: Verify public health endpoint
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Health check public URL (HTTP 200 required)
        run: |
          set -euo pipefail
          URL="$PUBLIC_URL"
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /tmp/body.html -w '%{http_code}' "$URL" || true)
            echo "Attempt ${i}: HTTP ${CODE}"
            if [ "$CODE" = "200" ]; then
              head -c 400 /tmp/body.html || true
              exit 0
            fi
            sleep 10
          done
          echo "Health check failed: never received HTTP 200 from ${URL}"
          exit 1

      - name: Health check API proxy path (informational)
        run: |
          set -euo pipefail
          CODE=$(curl -s -o /tmp/api.json -w '%{http_code}' "$PUBLIC_URL/api/raw-topology" || true)
          echo "API endpoint HTTP ${CODE}"
          head -c 400 /tmp/api.json || true