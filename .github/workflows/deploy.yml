name: Build Deploy Verify AI Topology Builder

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  AWS_REGION: ap-south-1
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  ECR_REPOSITORY_URI: 759204735992.dkr.ecr.ap-south-1.amazonaws.com/ai-topology-builder
  INSTANCE_ID: i-0dc19e4f505aeba07
  PUBLIC_URL: http://13.205.250.122
  SECRETS_MANAGER_ID: deptic/AI_Topology-Builder/secrets
  CONTAINER_PORT: "8000"

jobs:
  build:
    name: Build Diagnostics and Docker Image to ECR
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      image_uri: ${{ steps.meta.outputs.image_uri }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies (dev deps for Vite build)
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Build diagnostics (production bundle via vite build)
        run: |
          set -euo pipefail
          node --version
          npm --version
          test -f package.json
          test -f index.html
          test -f server/index.js
          test -f src/main.jsx
          test -f src/App.jsx
          npm run build
          test -f dist/index.html
          ls -la dist
          ls -la dist/assets || true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials (static keys via AWS CLI)
        run: |
          set -euo pipefail
          REGION="$AWS_REGION"
          aws --version
          aws sts get-caller-identity

      - name: Login to Amazon ECR (direct AWS CLI)
        run: |
          set -euo pipefail
          REGION="$AWS_REGION"
          ECR_REGISTRY="${ECR_REPOSITORY_URI%%/*}"
          aws ecr get-login-password --region "$REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Compute image tag and URI
        id: meta
        run: |
          set -euo pipefail
          IMAGE_TAG="${GITHUB_SHA}"
          FULL_IMAGE="$ECR_REPOSITORY_URI:${IMAGE_TAG}"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "image_uri=${FULL_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "FULL_IMAGE=${FULL_IMAGE}" >> "$GITHUB_ENV"

      - name: Build Docker image (context ., Dockerfile at repo root)
        run: |
          set -euo pipefail
          docker build -t "$FULL_IMAGE" -f Dockerfile .
          docker images "$FULL_IMAGE"

      - name: Push image to ECR
        run: |
          set -euo pipefail
          docker push "$FULL_IMAGE"
          docker push "$ECR_REPOSITORY_URI:latest" || true

      - name: Tag image as latest
        run: |
          set -euo pipefail
          docker tag "$FULL_IMAGE" "$ECR_REPOSITORY_URI:latest"

  deploy:
    name: Deploy to EC2 Docker via SSM
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials (static keys via AWS CLI)
        run: |
          set -euo pipefail
          aws --version
          aws sts get-caller-identity

      - name: Resolve secrets from AWS Secrets Manager
        run: |
          set -euo pipefail
          REGION="$AWS_REGION"
          SECRET_JSON="$(aws secretsmanager get-secret-value --secret-id "$SECRETS_MANAGER_ID" --region "$REGION" --query SecretString --output text)"
          echo "$SECRET_JSON" > /tmp/deploy-secrets.json
          echo "Secrets retrieved for deployment."

      - name: Write SSM commands payload to JSON file
        run: |
          cat > /tmp/ssm-params.json << 'SSMPARAMS'
          {
            "commands": [
              "set -euo pipefail",
              "export REGION=ap-south-1",
              "export ECR_REGISTRY=759204735992.dkr.ecr.ap-south-1.amazonaws.com",
              "export IMAGE_URI=759204735992.dkr.ecr.ap-south-1.amazonaws.com/ai-topology-builder:${IMAGE_TAG}",
              "aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $ECR_REGISTRY",
              "docker pull $IMAGE_URI",
              "docker stop app || true",
              "docker rm app || true",
              "SECRET_STRING=$(aws secretsmanager get-secret-value --secret-id deptic/AI_Topology-Builder/secrets --region $REGION --query SecretString --output text)",
              "GROQ_API_KEY=$(echo \"$SECRET_STRING\" | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get(\"GROQ_API_KEY\",\"\"))' 2>/dev/null || echo '')",
              "PORT=$(echo \"$SECRET_STRING\" | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get(\"PORT\",\"8000\"))' 2>/dev/null || echo '8000')",
              "BACKEND_PORT=$(echo \"$SECRET_STRING\" | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get(\"BACKEND_PORT\",\"8000\"))' 2>/dev/null || echo '8000')",
              "FRONTEND_PORT=$(echo \"$SECRET_STRING\" | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get(\"FRONTEND_PORT\",\"80\"))' 2>/dev/null || echo '80')",
              "docker run -d --restart always -p 80:80 --name app -e PORT=$PORT -e GROQ_API_KEY=$GROQ_API_KEY -e BACKEND_PORT=$BACKEND_PORT -e FRONTEND_PORT=$FRONTEND_PORT $IMAGE_URI",
              "sleep 5",
              "docker ps --filter name=app --format '{{.ID}} {{.Status}}'"
            ]
          }
          SSMPARAMS
          python3 - << 'PYEOF'
          import json, os
          path = '/tmp/ssm-params.json'
          with open(path) as f:
              data = json.load(f)
          tag = os.environ.get('IMAGE_TAG', '')
          for i, cmd in enumerate(data['commands']):
              data['commands'][i] = cmd.replace('${IMAGE_TAG}', tag)
          with open(path, 'w') as f:
              json.dump(data, f, indent=2)
          print('SSM payload written with image tag:', tag)
          PYEOF

      - name: Send SSM command to EC2 instance
        id: ssm
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
        run: |
          set -euo pipefail
          REGION="$AWS_REGION"
          INSTANCE_ID="$INSTANCE_ID"
          COMMAND_ID=$(aws ssm send-command --instance-ids "$INSTANCE_ID" --region "$REGION" --document-name "AWS-RunShellScript" --parameters file:///tmp/ssm-params.json --query "Command.CommandId" --output text)
          echo "command_id=${COMMAND_ID}" >> "$GITHUB_OUTPUT"
          echo "Sent SSM command: ${COMMAND_ID}"

      - name: Wait for SSM command completion
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
        run: |
          set -euo pipefail
          REGION="$AWS_REGION"
          INSTANCE_ID="$INSTANCE_ID"
          COMMAND_ID="${{ steps.ssm.outputs.command_id }}"
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$REGION" --query "Status" --output text || echo "Pending")
            echo "SSM status: $STATUS"
            if [ "$STATUS" = "Success" ]; then
              echo "SSM command succeeded."
              exit 0
            fi
            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "TimedOut" ] || [ "$STATUS" = "Cancelled" ]; then
              echo "SSM command failed with status $STATUS"
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$REGION" --query "StandardErrorContent" --output text || true
              exit 1
            fi
            sleep 10
          done
          echo "SSM command timed out waiting for success."
          exit 1

  verify:
    name: Verify Public Health Endpoint
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Health check public URL until HTTP 200
        run: |
          set -euo pipefail
          URL="$PUBLIC_URL"
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /tmp/health-body -w "%{http_code}" "$URL" || true)
            echo "Attempt $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "Health check passed with HTTP 200."
              head -c 500 /tmp/health-body || true
              exit 0
            fi
            sleep 10
          done
          echo "Health check failed: never received HTTP 200 from $URL"
          exit 1

      - name: Verify backend API route proxied through nginx
        run: |
          set -euo pipefail
          CODE=$(curl -s -o /tmp/api-body -w "%{http_code}" "$PUBLIC_URL/api/raw-topology" || true)
          echo "API endpoint HTTP $CODE"
          if [ "$CODE" = "200" ]; then
            head -c 500 /tmp/api-body || true
          else
            echo "Backend API route not reachable (non-fatal notice)."
          fi