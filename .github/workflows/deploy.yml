name: Deploy to EC2 via SSM
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      PUBLIC_URL: http://3.7.92.177
      REGION: ap-south-1
      INSTANCE_ID: i-03d0609dca0af1daa
      ECR_REPO_URI: 759204735992.dkr.ecr.ap-south-1.amazonaws.com/ai-topology-builder
      IMAGE_TAG: latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Compute Docker image URI
        id: image_uri
        run: |
          REGISTRY=${ECR_REPO_URI%%/*}
          REPO=${ECR_REPO_URI#*/}
          IMAGE_URI=${REGISTRY}/${REPO}:${IMAGE_TAG}
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV
          echo "ECR_REGISTRY=$REGISTRY" >> $GITHUB_ENV
          echo "ECR_REPOSITORY=$REPO" >> $GITHUB_ENV

      - name: Log in to Amazon ECR
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          aws ecr get-login-password --region "$REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Build Docker image
        run: |
          docker build -t "$IMAGE_URI" .

      - name: Push Docker image
        run: |
          docker push "$IMAGE_URI"

      - name: Diagnostics
        run: |
          docker image ls
          docker --version

      - name: Prepare SSM deployment script
        run: |
          cat > /tmp/ssm-params.json << 'EOF'
          {
            "commands": [
              "aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $ECR_REGISTRY",
              "docker pull $IMAGE_URI",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always -p 80:80 --name app $IMAGE_URI"
            ]
          }
          EOF

      - name: Deploy container to EC2 via SSM
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --region "$REGION" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" \
            --output text)
          echo "SSM Command ID: $COMMAND_ID"

      - name: Health check
        run: |
          echo "Waiting for deployment to stabilize..."
          sleep 30
          echo "Checking health at $PUBLIC_URL"
          curl -fL "$PUBLIC_URL" || exit 1