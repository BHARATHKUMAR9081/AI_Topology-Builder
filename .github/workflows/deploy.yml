name: Deploy to EC2 via SSM

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  REGION: ap-south-1
  ECR_REGISTRY: 759204735992.dkr.ecr.ap-south-1.amazonaws.com
  ECR_REPOSITORY: ai-topology-builder
  IMAGE_TAG: latest
  INSTANCE_ID: i-03d0609dca0af1daa
  PUBLIC_URL: http://3.7.92.177
  DETECTED_CONTAINER_PORT: 80
  DOCKERFILE_PATH: .

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build production assets
        run: npm run build

      - name: Compute image URI
        id: imageuri
        run: |
          IMAGE_URI=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_OUTPUT
          echo "Docker image URI: $IMAGE_URI"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker login
        run: |
          aws ecr get-login-password --region $REGION | \
            docker login --username AWS --password-stdin $ECR_REGISTRY

      - name: Build Docker image
        run: |
          docker build -t ${{ steps.imageuri.outputs.IMAGE_URI }} .

      - name: Push Docker image to ECR
        run: |
          docker push ${{ steps.imageuri.outputs.IMAGE_URI }}

      - name: Prepare SSM deployment script
        run: |
          cat > /tmp/ssm-params.json <<EOF
          {
            "commands": [
              "aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $ECR_REGISTRY",
              "docker pull ${{ steps.imageuri.outputs.IMAGE_URI }}",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always -p 80:80 --name app ${{ steps.imageuri.outputs.IMAGE_URI }}"
            ]
          }
          EOF
          echo "SSM script created at /tmp/ssm-params.json"

      - name: Send SSM command to EC2 instance
        id: ssm
        run: |
          IMAGE_URI=${{ steps.imageuri.outputs.IMAGE_URI }}
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --region "$REGION" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" \
            --output text)
          echo "command_id=$COMMAND_ID" >> $GITHUB_OUTPUT
          echo "SSM Command ID: $COMMAND_ID"

      - name: Wait for deployment to stabilize
        run: sleep 30

      - name: Health check
        run: |
          echo "Checking health at $PUBLIC_URL"
          curl -fL "$PUBLIC_URL" || exit 1