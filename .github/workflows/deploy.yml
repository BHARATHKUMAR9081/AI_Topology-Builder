name: Build Deploy Verify AI Topology Builder

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  AWS_REGION: ap-south-1
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  ECR_REPOSITORY_URI: 759204735992.dkr.ecr.ap-south-1.amazonaws.com/ai-topology-builder
  INSTANCE_ID: i-080a6990e1715a190
  PUBLIC_URL: http://43.204.165.22
  SECRETS_MANAGER_ID: deptic/AI_Topology-Builder/secrets
  CONTAINER_PORT: 80

jobs:
  build:
    name: Build Diagnostics and Docker Image to ECR
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      image_uri: ${{ steps.meta.outputs.image_uri }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Build diagnostics - toolchain and repository layout
        run: |
          set -e
          echo "--- Build diagnostics ---"
          node --version
          npm --version
          docker --version
          echo "--- Repository root ---"
          ls -la
          echo "--- package.json scripts ---"
          cat package.json
          echo "--- vite.config.js ---"
          cat vite.config.js
          echo "--- Dockerfile ---"
          cat Dockerfile
          test -f Dockerfile || { echo "Dockerfile missing"; exit 1; }
          test -f server/index.js || { echo "server/index.js missing"; exit 1; }
          test -f index.html || { echo "index.html missing"; exit 1; }

      - name: Install dependencies (frontend + backend)
        run: npm install --legacy-peer-deps

      - name: Production build (Vite bundle consumed by Dockerfile builder stage)
        run: npm run build

      - name: Verify frontend build artifact
        run: |
          set -e
          test -f dist/index.html || { echo "dist/index.html not produced"; exit 1; }
          echo "dist contents:"
          ls -la dist

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image tag and URI
        id: meta
        run: |
          IMAGE_TAG="$(git rev-parse --short HEAD)-$(date -u +%Y%m%d%H%M%S)"
          FULL_IMAGE="$ECR_REPOSITORY_URI:$IMAGE_TAG"
          {
            echo "image_tag=$IMAGE_TAG"
            echo "image_uri=$FULL_IMAGE"
          } >> "$GITHUB_OUTPUT"
          echo "IMAGE_URI=$FULL_IMAGE" >> "$GITHUB_ENV"
          echo "Building and pushing: $FULL_IMAGE"

      - name: Authenticate Docker to ECR (AWS CLI, static credentials)
        run: |
          ECR_REGISTRY="${ECR_REPOSITORY_URI%/*}"
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Build and push Docker image (context = repository root, Dockerfile path = .)
        run: |
          docker build -t "$IMAGE_URI" -t "$ECR_REPOSITORY_URI:latest" -f Dockerfile .
          docker push "$IMAGE_URI"
          docker push "$ECR_REPOSITORY_URI:latest"

  deploy:
    name: Deploy to EC2 via SSM RunShellScript
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Write SSM commands payload to JSON file
        env:
          IMAGE_URI: ${{ needs.build.outputs.image_uri }}
        run: |
          cat > /tmp/ssm-params.json << 'SSMPARAMS'
          {
            "commands": [
              "set -e",
              "export AWS_DEFAULT_REGION=ap-south-1",
              "GROQ_API_KEY=$(aws secretsmanager get-secret-value --secret-id deptic/AI_Topology-Builder/secrets --query SecretString --output text | python3 -c \"import sys, json; print(json.load(sys.stdin).get('GROQ_API_KEY', ''))\" || echo '')",
              "ECR_REGISTRY=759204735992.dkr.ecr.ap-south-1.amazonaws.com",
              "aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin $ECR_REGISTRY",
              "docker pull IMAGE_URI_PLACEHOLDER",
              "docker stop app || true",
              "docker rm app || true",
              "if [ -n \"$GROQ_API_KEY\" ]; then docker run -d --restart always -p 80:80 --name app -e GROQ_API_KEY=$GROQ_API_KEY -e PORT=8000 -e NODE_ENV=production IMAGE_URI_PLACEHOLDER; else docker run -d --restart always -p 80:80 --name app -e PORT=8000 -e NODE_ENV=production IMAGE_URI_PLACEHOLDER; fi",
              "docker image prune -f || true"
            ]
          }
          SSMPARAMS
          sed -i "s|IMAGE_URI_PLACEHOLDER|$IMAGE_URI|g" /tmp/ssm-params.json
          echo "--- SSM parameters payload ---"
          cat /tmp/ssm-params.json

      - name: Send SSM command to EC2 instance
        run: |
          set -e
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --region "$AWS_REGION" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" \
            --output text)
          echo "COMMAND_ID=$COMMAND_ID"
          echo "COMMAND_ID=$COMMAND_ID" >> "$GITHUB_ENV"

      - name: Wait for SSM command completion
        run: |
          set -e
          STATUS=""
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --region "$AWS_REGION" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "Attempt $i: SSM status=$STATUS"
            case "$STATUS" in
              Success) echo "SSM command succeeded"; exit 0 ;;
              InProgress|Pending|Delayed) sleep 10 ;;
              *) echo "SSM command failed with status: $STATUS"; exit 1 ;;
            esac
          done
          echo "Timed out waiting for SSM command"; exit 1

      - name: Show SSM command output
        if: always()
        run: |
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --region "$AWS_REGION" \
            --query "{Status:Status,StdOut:StandardOutputContent,StdErr:StandardErrorContent}" \
            || true

  verify:
    name: Verify public health endpoint returns HTTP 200
    runs-on: ubuntu-latest
    needs: [build, deploy]
    steps:
      - name: Health check public URL (HTTP 200 required)
        run: |
          set -e
          echo "Waiting for nginx + node container to come up on $PUBLIC_URL ..."
          sleep 10
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /tmp/body.html -w "%{http_code}" "$PUBLIC_URL/" || true)
            echo "Attempt $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "--- response body (head) ---"
              head -c 500 /tmp/body.html || true
              echo "Health check passed: HTTP 200 from $PUBLIC_URL"
              exit 0
            fi
            sleep 10
          done
          echo "Health check failed: never received HTTP 200 from $PUBLIC_URL"
          exit 1

      - name: Verify backend API proxy through nginx (/api/raw-topology)
        run: |
          set -e
          CODE=$(curl -s -o /tmp/api.json -w "%{http_code}" "$PUBLIC_URL/api/raw-topology" || true)
          echo "API endpoint HTTP code: $CODE"
          if [ "$CODE" = "200" ]; then
            head -c 500 /tmp/api.json || true
            echo ""
            echo "Backend proxy verified: /api/raw-topology returned HTTP 200"
          else
            echo "WARNING: /api/raw-topology returned HTTP $CODE (frontend still served)"
          fi