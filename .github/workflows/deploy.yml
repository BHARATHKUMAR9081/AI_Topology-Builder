name: Deploy to EC2 via SSM

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      ECR_REPO_URI: 759204735992.dkr.ecr.ap-south-1.amazonaws.com/ai-topology-builder
      INSTANCE_ID: i-03d0609dca0af1daa
      PUBLIC_URL: http://3.7.92.177
      REGION: ap-south-1
      IMAGE_TAG: latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare build variables
        id: vars
        run: |
          echo "ECR_REGISTRY=${ECR_REPO_URI%%/*}" >> $GITHUB_OUTPUT
          echo "ECR_REPOSITORY=${ECR_REPO_URI#*/}" >> $GITHUB_OUTPUT
          echo "IMAGE_URI=${ECR_REPO_URI}:${IMAGE_TAG}" >> $GITHUB_OUTPUT

      - name: Log in to Amazon ECR
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          aws ecr get-login-password --region "$REGION" | docker login --username AWS --password-stdin "${{ steps.vars.outputs.ECR_REGISTRY }}"

      - name: Build Docker image
        run: |
          docker build -t "${{ steps.vars.outputs.IMAGE_URI }}" .
        env:
          IMAGE_URI: ${{ steps.vars.outputs.IMAGE_URI }}

      - name: Push Docker image
        run: |
          docker push "${{ steps.vars.outputs.IMAGE_URI }}"
        env:
          IMAGE_URI: ${{ steps.vars.outputs.IMAGE_URI }}

      - name: Docker diagnostics
        run: |
          docker --version
          docker image ls

      - name: Prepare SSM deployment script
        run: |
          cat > /tmp/ssm-params.json <<EOF
          {
            "commands": [
              "aws ecr get-login-password --region ${REGION} | docker login --username AWS --password-stdin ${{ steps.vars.outputs.ECR_REGISTRY }}",
              "docker pull ${{ steps.vars.outputs.IMAGE_URI }}",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always -p 80:80 --name app ${{ steps.vars.outputs.IMAGE_URI }}"
            ]
          }
          EOF
        env:
          REGION: ${{ env.REGION }}
          ECR_REGISTRY: ${{ steps.vars.outputs.ECR_REGISTRY }}
          IMAGE_URI: ${{ steps.vars.outputs.IMAGE_URI }}

      - name: Deploy container to EC2 via SSM
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --region "$REGION" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" \
            --output text)
          echo "SSM Command ID: $COMMAND_ID"

      - name: Health check
        run: |
          echo "Waiting for deployment to stabilize..."
          sleep 30
          echo "Checking health at $PUBLIC_URL"
          curl -fL "$PUBLIC_URL" || exit 1
        env:
          PUBLIC_URL: ${{ env.PUBLIC_URL }}