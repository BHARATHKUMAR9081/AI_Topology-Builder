name: Build Deploy Verify AI Topology Builder

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  AWS_REGION: ap-south-1
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  ECR_REPOSITORY_URI: 759204735992.dkr.ecr.ap-south-1.amazonaws.com/ai-topology-builder
  INSTANCE_ID: i-080a6990e1715a190
  PUBLIC_URL: http://43.204.165.22
  SECRETS_MANAGER_ID: deptic/AI_Topology-Builder/secrets
  CONTAINER_PORT: 80

jobs:
  build:
    name: Build Diagnostics and Docker Image to ECR
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      image_uri: ${{ steps.meta.outputs.image_uri }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Build diagnostics - toolchain and repository layout
        run: |
          set -e
          echo "--- Build diagnostics ---"
          node --version
          npm --version
          docker --version
          echo "--- Repository root ---"
          ls -la
          echo "--- package.json scripts ---"
          cat package.json
          echo "--- vite.config.js ---"
          cat vite.config.js
          test -f Dockerfile || { echo "Dockerfile missing"; exit 1; }
          test -f server/index.js || { echo "server/index.js missing"; exit 1; }
          test -f index.html || { echo "index.html missing"; exit 1; }

      - name: Install dependencies (frontend + backend)
        run: npm install --legacy-peer-deps

      - name: Production build (Vite bundle consumed by Dockerfile builder stage)
        run: npm run build

      - name: Verify frontend build artifact
        run: |
          set -e
          test -f dist/index.html || { echo "dist/index.html not produced"; exit 1; }
          echo "dist contents:"
          ls -la dist

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image tag and URI
        id: meta
        run: |
          IMAGE_TAG="$(git rev-parse --short HEAD)-$(date -u +%Y%m%d%H%M%S)"
          FULL_IMAGE="$ECR_REPOSITORY_URI:$IMAGE_TAG"
          {
            echo "image_tag=$IMAGE_TAG"
            echo "image_uri=$FULL_IMAGE"
          } >> "$GITHUB_OUTPUT"
          echo "IMAGE_URI=$FULL_IMAGE" >> "$GITHUB_ENV"
          echo "Building and pushing: $FULL_IMAGE"

      - name: Authenticate Docker to ECR (AWS CLI, static credentials)
        run: |
          ECR_REGISTRY="${ECR_REPOSITORY_URI%/*}"
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Build and push Docker image (context = repository root, Dockerfile path = .)
        run: |
          docker build -t "$IMAGE_URI" -t "$ECR_REPOSITORY_URI:latest" -f Dockerfile .
          docker push "$IMAGE_URI"
          docker push "$ECR_REPOSITORY_URI:latest"

  deploy:
    name: Deploy to EC2 via SSM RunShellScript
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Write SSM commands payload to JSON file
        run: |
          cat > /tmp/ssm-params.json << 'SSMPARAMS'
          {
            "commands": [
              "set -e",
              "export AWS_REGION=ap-south-1",
              "ECR_REGISTRY=759204735992.dkr.ecr.ap-south-1.amazonaws.com",
              "IMAGE_URI=${{ needs.build.outputs.image_uri }}",
              "aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY",
              "docker pull $IMAGE_URI",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always -p 80:80 --name app -e PORT=8000 -e NODE_ENV=production $IMAGE_URI",
              "docker image prune -f || true"
            ]
          }
          SSMPARAMS
          echo "SSM payload written:"
          cat /tmp/ssm-params.json

      - name: Send SSM command to EC2 instance
        run: |
          set -e
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --region "$AWS_REGION" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" \
            --output text)
          echo "COMMAND_ID=$COMMAND_ID"
          echo "COMMAND_ID=$COMMAND_ID" >> "$GITHUB_ENV"

      - name: Wait for SSM command completion
        run: |
          set -e
          STATUS=""
          for i in $(seq 1 60); do
            STATUS=$(aws ssm list-commands \
              --command-id "$COMMAND_ID" \
              --region "$AWS_REGION" \
              --query "Commands[0].Status" \
              --output text)
            echo "Attempt $i: SSM status=$STATUS"
            if [ "$STATUS" = "Success" ]; then
              echo "SSM command succeeded"
              exit 0
            fi
            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "TimedOut" ] || [ "$STATUS" = "Cancelled" ]; then
              echo "SSM command failed with status $STATUS"
              break
            fi
            sleep 10
          done
          echo "--- SSM command output (Errors) ---"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --region "$AWS_REGION" \
            --query "StandardErrorContent" \
            --output text || true
          exit 1

  verify:
    name: Verify public deployment over HTTP
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Wait for nginx + node app to boot on instance
        run: sleep 15

      - name: Health check public URL (HTTP 200 required)
        run: |
          set -e
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /tmp/index.html -w "%{http_code}" "$PUBLIC_URL/" || true)
            echo "Attempt $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "Health check passed with HTTP 200"
              head -c 400 /tmp/index.html || true
              exit 0
            fi
            sleep 10
          done
          echo "Health check failed: never received HTTP 200 from $PUBLIC_URL"
          exit 1

      - name: Verify backend API proxy through nginx (/api/raw-topology)
        run: |
          set -e
          CODE=$(curl -s -o /tmp/raw-topology.json -w "%{http_code}" "$PUBLIC_URL/api/raw-topology")
          echo "GET /api/raw-topology -> HTTP $CODE"
          if [ "$CODE" != "200" ]; then
            echo "Backend API health check failed"
            exit 1
          fi
          cat /tmp/raw-topology.json
          node -e "const d=require('/tmp/raw-topology.json'); if(!d.servers || !d.system){console.error('unexpected payload');process.exit(1)}; console.log('Backend payload OK:', d.system)"

      - name: Deployment summary
        run: |
          {
            echo "### AI Topology Builder deployment"
            echo "- Image: ${{ needs.build.outputs.image_uri }}"
            echo "- Instance: $INSTANCE_ID"
            echo "- Public URL: $PUBLIC_URL"
            echo "- Container port (nginx): $CONTAINER_PORT"
          } >> "$GITHUB_STEP_SUMMARY"