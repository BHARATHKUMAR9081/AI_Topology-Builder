name: Build Deploy Verify AI Topology Builder

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  AWS_REGION: ap-south-1
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  ECR_REPOSITORY_URI: 759204735992.dkr.ecr.ap-south-1.amazonaws.com/ai-topology-builder
  INSTANCE_ID: i-0dc19e4f505aeba07
  PUBLIC_URL: http://13.205.250.122
  SECRETS_MANAGER_ID: deptic/AI_Topology-Builder/secrets
  CONTAINER_PORT: "80"

jobs:
  build:
    name: Build Diagnostics and Docker Image to ECR
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      image_uri: ${{ steps.meta.outputs.image_uri }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies (dev deps for Vite build)
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Build diagnostics (production bundle via vite build)
        run: |
          set -euo pipefail
          node --version
          npm --version
          test -f package.json
          test -f index.html
          test -f vite.config.js
          test -f server/index.js
          test -f src/main.jsx
          test -f src/App.jsx
          npm run build
          test -f dist/index.html
          ls -la dist
          ls -la dist/assets || true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials (static keys via AWS CLI)
        run: |
          set -euo pipefail
          REGION="$AWS_REGION"
          aws --version
          aws sts get-caller-identity

      - name: Login to Amazon ECR (direct AWS CLI)
        run: |
          set -euo pipefail
          REGION="$AWS_REGION"
          ECR_REGISTRY="${ECR_REPOSITORY_URI%%/*}"
          aws ecr get-login-password --region "$REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Compute image tag and URI
        id: meta
        run: |
          set -euo pipefail
          IMAGE_TAG="${GITHUB_SHA}"
          FULL_IMAGE="$ECR_REPOSITORY_URI:${IMAGE_TAG}"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "image_uri=${FULL_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "FULL_IMAGE=${FULL_IMAGE}" >> "$GITHUB_ENV"

      - name: Build Docker image (context ., Dockerfile at repo root)
        run: |
          set -euo pipefail
          docker build -t "$FULL_IMAGE" -f Dockerfile .
          docker images "$FULL_IMAGE"

      - name: Tag image as latest
        run: |
          set -euo pipefail
          docker tag "$FULL_IMAGE" "$ECR_REPOSITORY_URI:latest"

      - name: Push image to ECR
        run: |
          set -euo pipefail
          docker push "$FULL_IMAGE"
          docker push "$ECR_REPOSITORY_URI:latest" || true

  deploy:
    name: Deploy to EC2 Docker via SSM
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials (static keys via AWS CLI)
        run: |
          set -euo pipefail
          aws --version
          aws sts get-caller-identity

      - name: Resolve secrets from AWS Secrets Manager (GROQ_API_KEY)
        id: secrets
        run: |
          set -euo pipefail
          REGION="$AWS_REGION"
          SECRET_JSON="$(aws secretsmanager get-secret-value --secret-id "$SECRETS_MANAGER_ID" --region "$REGION" --query SecretString --output text)"
          GROQ_API_KEY="$(printf '%s' "$SECRET_JSON" | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get("GROQ_API_KEY",""))' || true)"
          PORT_VAL="$(printf '%s' "$SECRET_JSON" | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get("PORT","8000"))' || true)"
          if [ -z "$GROQ_API_KEY" ]; then GROQ_API_KEY="your_groq_api_key_here"; fi
          if [ -z "$PORT_VAL" ]; then PORT_VAL="8000"; fi
          {
            echo "GROQ_API_KEY<<EOF_SECRET"
            echo "$GROQ_API_KEY"
            echo "EOF_SECRET"
            echo "PORT_VAL=${PORT_VAL}"
          } >> "$GITHUB_OUTPUT"

      - name: Write SSM command payload to JSON file
        env:
          IMAGE_URI: ${{ needs.build.outputs.image_uri }}
          GROQ_API_KEY: ${{ steps.secrets.outputs.GROQ_API_KEY }}
          PORT_VAL: ${{ steps.secrets.outputs.PORT_VAL }}
        run: |
          set -euo pipefail
          REGION="$AWS_REGION"
          ECR_REGISTRY="${ECR_REPOSITORY_URI%%/*}"
          cat > /tmp/ssm-params.json << SSMPARAMS
          {
            "commands": [
              "set -euo pipefail",
              "export AWS_DEFAULT_REGION=$REGION",
              "aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $ECR_REGISTRY",
              "docker pull $IMAGE_URI",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always -p 80:80 --name app -e GROQ_API_KEY=$GROQ_API_KEY -e PORT=$PORT_VAL -e NODE_ENV=production $IMAGE_URI",
              "docker ps --filter name=app --format '{{.ID}} {{.Status}}'"
            ]
          }
          SSMPARAMS
          python3 -m json.tool /tmp/ssm-params.json > /dev/null

      - name: Send SSM command to EC2 instance
        run: |
          set -euo pipefail
          REGION="$AWS_REGION"
          COMMAND_ID=$(aws ssm send-command --instance-ids "$INSTANCE_ID" --region "$REGION" --document-name "AWS-RunShellScript" --parameters file:///tmp/ssm-params.json --query "Command.CommandId" --output text)
          echo "COMMAND_ID=${COMMAND_ID}" >> "$GITHUB_ENV"
          echo "Dispatched SSM command: ${COMMAND_ID}"

      - name: Wait for SSM command completion
        run: |
          set -euo pipefail
          REGION="$AWS_REGION"
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$REGION" --query Status --output text || echo "Pending")
            echo "SSM status: $STATUS"
            case "$STATUS" in
              Success) echo "SSM command succeeded"; exit 0 ;;
              InProgress|Pending|Delayed) sleep 10 ;;
              *) echo "SSM command failed with status: $STATUS"; aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$REGION" || true; exit 1 ;;
            esac
          done
          echo "Timed out waiting for SSM command"; exit 1

  verify:
    name: Verify Public Health Endpoint
    runs-on: ubuntu-latest
    needs: [build, deploy]
    steps:
      - name: Health check public URL (HTTP 200 required)
        run: |
          set -euo pipefail
          URL="$PUBLIC_URL"
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /tmp/body.html -w '%{http_code}' "$URL" || true)
            echo "Attempt $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "Health check passed with HTTP 200"
              head -c 400 /tmp/body.html || true
              exit 0
            fi
            sleep 10
          done
          echo "Health check failed: never received HTTP 200 from $URL"
          exit 1

      - name: Health check API raw topology endpoint
        run: |
          set -euo pipefail
          URL="$PUBLIC_URL/api/raw-topology"
          for i in $(seq 1 15); do
            CODE=$(curl -s -o /tmp/api.json -w '%{http_code}' "$URL" || true)
            echo "Attempt $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "API health check passed with HTTP 200"
              head -c 400 /tmp/api.json || true
              exit 0
            fi
            sleep 10
          done
          echo "API health check failed: never received HTTP 200 from $URL"
          exit 1